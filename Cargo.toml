[package]
name = "qrctrl"
version = "0.9.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
enigo = "0.6"
qrcode = "0.14"
rand = "0.9"
if-addrs = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
rust-embed = { version = "8", features = ["debug-embed"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
tray-icon = "0.24"
tao = "0.35"
softbuffer = "0.4"
toml = "0.8"
# 在线升级：ureq（默认 rustls，无 OpenSSL 依赖）拉 manifest + 下载资产；
# self-replace 处理「替换正在运行的自身」；semver 比较版本；sha2 完整性校验；
# minisign-verify 是 Ed25519 验签（Tauri updater 同款，verify-only 零依赖），
# 防 GitHub 账号被盗推恶意更新——HTTPS 只保通道，签名保真实性。
ureq = "3"
semver = "1"
sha2 = "0.10"
self-replace = "1"
minisign-verify = "0.2"

# zip 仅 macOS 需要：更新资产是 .app.zip（ditto -c -k --keepParent 格式），
# 解压恢复 bundle。只开 deflate（ditto 默认压缩格式），其余 feature 省体积。
[target.'cfg(target_os = "macos")'.dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
# 更新签名工具（examples/keygen_update.rs + sign_update.rs）用：
# minisign 是 jedisct1 的完整实现（生成密钥对 / 签名），只在开发与 CI 编译，
# 不进 release 依赖树；客户端运行时只依赖上面的 minisign-verify。
minisign = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
